name: Deploy React + Vite to GitHub Pages

on:

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build-deploy:

    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20

      # Install Dependencies
      - name: Install Dependencies
        run: npm install

      # Build Project
      - name: Build Project
        run: npm run build

        

      # Deploy
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_dir: ./dist