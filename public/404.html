<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <script>

    /*
      SPA GitHub Pages Redirect
    */

    const path =
      window.location.pathname;

    const repo =
      "/satellitecropmonitoring";

    sessionStorage.redirect =
      path.replace(repo, "");

    window.location.replace(repo);

  </script>

</head>

<body>
    <script>

  /*
    Restore React Route
  */

  const redirect =
    sessionStorage.redirect;

  delete sessionStorage.redirect;

  if (redirect &&
      redirect !== location.pathname) {

    history.replaceState(
      null,
      null,
      redirect
    );
  }

</script>
</body>

</html>
